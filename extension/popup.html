<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flow Kit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Palette mirrors the dashboard (dashboard/src/index.css) so the extension
       and the console read as one product. Keep them in step when either moves. */
    :root {
      --bg:        #0a0b0f;
      --surface:   #0f1116;
      --card:      #14161d;
      --card-hover:#191c24;
      --raised:    #1d2029;
      --border:    #242833;
      --accent:    #8b93ff;
      --accent-strong: #6f78f7;
      --accent-soft: rgb(139 147 255 / 0.12);
      --green:     #3ddc97;
      --red:       #ff6b6b;
      --yellow:    #f5b945;
      --text:      #eceef3;
      --muted:     #8a90a2;
      --faint:     #5d6374;
      --radius:    10px;
      --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'Fira Code', SFMono-Regular, monospace;
    }

    html, body {
      width: 380px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-title span { color: var(--accent); }

    #btn-panel {
      padding: 0 12px;
      height: 30px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: #0a0b0f;
      cursor: pointer;
      transition: filter 0.15s, background 0.15s;
    }

    #btn-panel:hover { filter: brightness(1.1); }
    #btn-panel:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #log-count {
      background: var(--raised);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      color: var(--muted);
    }

    #log-list {
      max-height: 440px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #log-list::-webkit-scrollbar { width: 6px; }
    #log-list::-webkit-scrollbar-track { background: transparent; }
    #log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    .log-empty {
      padding: 32px 14px;
      text-align: center;
      color: var(--faint);
      font-size: 13px;
    }

    .entry { border-bottom: 1px solid var(--border); }
    .entry:last-child { border-bottom: none; }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }

    .entry-row:hover { background: var(--card-hover); }
    .entry.open .entry-row { background: var(--card); }

    .entry-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--faint);
      min-width: 58px;
      flex-shrink: 0;
    }

    .entry-type {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-time {
      font-size: 11px;
      color: var(--faint);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-ok   { background: rgb(61 220 151 / 0.12); border-color: rgb(61 220 151 / 0.25); color: var(--green); }
    .badge-fail { background: rgb(255 107 107 / 0.12); border-color: rgb(255 107 107 / 0.25); color: var(--red); }
    .badge-proc { background: rgb(245 185 69 / 0.12); border-color: rgb(245 185 69 / 0.25); color: var(--yellow); }

    .expand-icon {
      font-size: 11px;
      color: var(--faint);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .entry.open .expand-icon { transform: rotate(90deg); }

    .entry-details {
      display: none;
      padding: 0 14px 12px;
      background: var(--card);
    }

    .entry.open .entry-details { display: block; }

    .detail-section { margin-top: 10px; }

    .detail-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
      margin-bottom: 4px;
    }

    .detail-value {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 110px;
      overflow-y: auto;
    }

    .detail-value.url {
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: none;
    }

    .detail-error { color: var(--red); }

    .footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--faint);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title"><span>Flow Kit</span> Extension</div>
    <button id="btn-panel">Side Panel</button>
  </header>

  <div class="log-header">
    Recent Requests
    <span id="log-count">0</span>
  </div>

  <div id="log-list">
    <div class="log-empty">No requests yet</div>
  </div>

  <div class="footer">Click a row to expand details</div>

  <script src="popup.js"></script>
</body>
</html>
