name: flowkit

services:
  agent:
    build: .
    image: flowkit-agent
    restart: unless-stopped
    env_file: .env
    environment:
      FLOW_AGENT_DIR: /data
      API_HOST: 0.0.0.0
      API_PORT: "8100"
      WS_HOST: 127.0.0.1
      WS_PORT: "9222"
      AUTH_ENABLED: "1"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      PUBLIC_URL: https://${DOMAIN}
    volumes:
      - flowkit-data:/data
volumes:
  flowkit-data:

